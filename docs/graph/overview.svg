    <text x="1132" y="119" text-anchor="end" font-size="36" font-weight="700">خريطة المشروع التفاعلية</text>
    <text x="1132" y="153" text-anchor="end" font-size="18" fill="#aebbd4">من النص العربي إلى الأدوات والتوثيق — استكشف العلاقات بنفسك</text>
    <g stroke="#687cae" stroke-width="2" fill="none" opacity=".65"><path d="M510 315C430 315 420 240 330 240"/><path d="M690 315C770 315 780 240 870 240"/><path d="M510 350C430 350 420 400 330 400"/><path d="M690 350C770 350 780 400 870 400"/><path d="M600 380V475"/></g>
