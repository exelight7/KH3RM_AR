<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">خريطة مشروع تعريب Kingdom Hearts III</title><desc id="desc">مخطط يربط مستودع التعريب بالترجمة والأدوات والتوثيق والحالة والبنية الفنية. اضغط لفتح الخريطة التفاعلية.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121a35"/><stop offset="1" stop-color="#090f1e"/></linearGradient><radialGradient id="glow"><stop stop-color="#8067e9" stop-opacity=".25"/><stop offset="1" stop-color="#8067e9" stop-opacity="0"/></radialGradient><linearGradient id="core" x2="1" y2="1"><stop stop-color="#6e57bc"/><stop offset="1" stop-color="#283955"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="618" rx="27" fill="none" stroke="#334264"/>
