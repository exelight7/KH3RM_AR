name: بلاغ عن مشكلة
description: بلاغ من سطر واحد عن مشكلة في التعريب العربي
body:
  - type: input
    id: words
    attributes:
      label: رقم السطر أو الكلمات التي رأيتها
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: المكان في اللعبة
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: نوع المشكلة
      options: [cut, reversed, english, meaning, boxes, crash]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: الإصدار
  - type: textarea
    id: note
    attributes:
      label: ملاحظات
  - type: markdown
    attributes:
      value: لا ترفق ملفات اللعبة.
